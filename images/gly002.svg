<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180">
  <rect width="400" height="180" fill="none"/>
  <!-- Title -->
  <text x="200" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">ATP-Struktur und Hydrolyse-Energie</text>

  <!-- Adenosin box -->
  <rect x="8" y="38" width="62" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="39" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a5f">Aden-</text>
  <text x="39" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a5f">osin</text>

  <!-- bond line Adenosin → α -->
  <line x1="70" y1="55" x2="88" y2="55" stroke="#475569" stroke-width="1.5"/>

  <!-- α-Phosphat -->
  <rect x="88" y="38" width="52" height="34" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="114" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">α-PO₄</text>
  <text x="114" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669">α</text>

  <!-- phosphoanhydride bond α–β (orange) -->
  <path d="M140 55 C148 43, 156 43, 164 55" fill="none" stroke="#d97706" stroke-width="2"/>
  <line x1="140" y1="55" x2="164" y2="55" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- β-Phosphat -->
  <rect x="164" y="38" width="52" height="34" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">β-PO₄</text>
  <text x="190" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669">β</text>

  <!-- phosphoanhydride bond β–γ (red, thicker = terminal) -->
  <path d="M216 55 C224 43, 232 43, 240 55" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="216" y1="55" x2="240" y2="55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- γ-Phosphat (highlighted yellow) -->
  <rect x="240" y="38" width="52" height="34" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="266" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#78350f">γ-PO₄</text>
  <text x="266" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">γ</text>

  <!-- + H₂O label -->
  <text x="306" y="52" font-family="Arial, sans-serif" font-size="11" fill="#475569">+ H₂O</text>

  <!-- legend: phosphoanhydride bonds label -->
  <text x="148" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d97706">α–β Bindung</text>
  <text x="250" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">β–γ Bindung</text>

  <!-- Arrow down from γ-PO4 -->
  <line x1="266" y1="72" x2="266" y2="108" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="261,104 266,114 271,104" fill="#dc2626"/>

  <!-- Hydrolysis annotation -->
  <rect x="60" y="118" width="280" height="44" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">Hydrolyse der β–γ-Phosphoanhydridbindung:</text>
  <text x="200" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">ATP + H₂O → ADP + Pᵢ     ΔG° = −31 kJ/mol</text>
</svg>
