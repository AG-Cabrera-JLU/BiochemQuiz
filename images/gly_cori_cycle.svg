<svg xmlns="http://www.w3.org/2000/svg" width="400" height="228" viewBox="0 0 400 228">
  <rect width="400" height="228" fill="none"/>
  <!-- Title -->
  <text x="200" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Cori-Zyklus</text>

  <!-- MUSKEL box -->
  <rect x="10" y="34" width="120" height="82" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Muskel</text>
  <text x="70" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e3a5f">Glucose</text>
  <line x1="70" y1="70" x2="70" y2="81" stroke="#1e40af" stroke-width="1.5"/>
  <polygon points="65,78 70,86 75,78" fill="#1e40af"/>
  <text x="78" y="80" font-family="Arial, sans-serif" font-size="9" fill="#475569">2 ATP</text>
  <text x="70" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e3a5f">2 Pyruvat</text>
  <line x1="70" y1="103" x2="70" y2="113" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="65,110 70,118 75,110" fill="#dc2626"/>
  <text x="78" y="112" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">LDH</text>

  <!-- Muscle: Lactat box -->
  <rect x="20" y="120" width="100" height="24" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="70" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">2 Lactat</text>

  <!-- LEBER box -->
  <rect x="270" y="34" width="120" height="82" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Leber</text>
  <text x="330" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">Glucose</text>
  <line x1="330" y1="70" x2="330" y2="81" stroke="#059669" stroke-width="1.5"/>
  <polygon points="325,78 330,86 335,78" fill="#059669"/>
  <text x="338" y="80" font-family="Arial, sans-serif" font-size="9" fill="#475569">−6 ATP</text>
  <text x="330" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">2 Pyruvat</text>
  <line x1="330" y1="103" x2="330" y2="113" stroke="#059669" stroke-width="1.5"/>
  <polygon points="325,110 330,118 335,110" fill="#059669"/>
  <text x="338" y="112" font-family="Arial, sans-serif" font-size="9" fill="#059669">GNG</text>

  <!-- Liver: Lactat box -->
  <rect x="280" y="120" width="100" height="24" rx="4" fill="#bbf7d0" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">2 Lactat</text>

  <!-- Arrow: Glucose liver → muscle (ABOVE boxes, curved arc) -->
  <path d="M270 44 Q200 24 130 44" fill="none" stroke="#059669" stroke-width="2"/>
  <polygon points="134,39 126,44 134,49" fill="#059669"/>
  <text x="200" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669">← Glucose (Blutkreislauf)</text>

  <!-- Arrow: Lactat muscle → liver (bottom, left to right) -->
  <line x1="122" y1="132" x2="278" y2="132" stroke="#dc2626" stroke-width="2"/>
  <polygon points="274,127 284,132 274,137" fill="#dc2626"/>
  <text x="200" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">Lactat (Blutkreislauf) →</text>

  <!-- Stoichiometry badge -->
  <rect x="80" y="155" width="240" height="38" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="200" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#713f12">Leber: 2 Lactat → 1 Glucose (−6 ATP)</text>
  <text x="200" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#713f12">Netto-Bilanz Zyklus: −4 ATP</text>

  <!-- Footnote -->
  <text x="200" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Muskel regeneriert NAD⁺ für weitere Glykolyse</text>
</svg>
