<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <rect width="400" height="220" fill="none"/>
  <!-- Title -->
  <text x="200" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Cori-Zyklus</text>

  <!-- MUSCLE box -->
  <rect x="10" y="26" width="120" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Muskel</text>
  <text x="70" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e3a5f">Glucose</text>
  <line x1="70" y1="61" x2="70" y2="73" stroke="#1e40af" stroke-width="1.5"/>
  <polygon points="65,70 70,78 75,70" fill="#1e40af"/>
  <text x="78" y="71" font-family="Arial, sans-serif" font-size="9" fill="#475569">2 ATP</text>
  <text x="70" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e3a5f">2 Pyruvat</text>
  <line x1="70" y1="95" x2="70" y2="105" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="65,102 70,110 75,102" fill="#dc2626"/>
  <text x="78" y="103" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">LDH</text>

  <!-- Muscle: Lactate -->
  <rect x="25" y="110" width="90" height="22" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">2 Lactat</text>

  <!-- LIVER box -->
  <rect x="270" y="26" width="120" height="80" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Leber</text>
  <text x="330" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">Glucose</text>
  <line x1="330" y1="61" x2="330" y2="73" stroke="#059669" stroke-width="1.5"/>
  <polygon points="325,70 330,78 335,70" fill="#059669"/>
  <text x="338" y="71" font-family="Arial, sans-serif" font-size="9" fill="#475569">−6 ATP</text>
  <text x="330" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">2 Pyruvat</text>
  <line x1="330" y1="95" x2="330" y2="105" stroke="#059669" stroke-width="1.5"/>
  <polygon points="325,102 330,110 335,102" fill="#059669"/>
  <text x="338" y="103" font-family="Arial, sans-serif" font-size="9" fill="#059669">GNG</text>

  <!-- Liver: Lactate input -->
  <rect x="285" y="110" width="90" height="22" rx="4" fill="#bbf7d0" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">2 Lactat</text>

  <!-- Arrow: Lactate muscle → liver (bottom, left to right) -->
  <line x1="118" y1="121" x2="282" y2="121" stroke="#dc2626" stroke-width="2"/>
  <polygon points="278,116 288,121 278,126" fill="#dc2626"/>
  <text x="200" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">Blutkreislauf</text>

  <!-- Arrow: Glucose liver → muscle (top, right to left) -->
  <line x1="270" y1="56" x2="133" y2="56" stroke="#059669" stroke-width="2"/>
  <polygon points="137,51 127,56 137,61" fill="#059669"/>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669">Blutkreislauf</text>

  <!-- Stoichiometry badge -->
  <rect x="110" y="148" width="180" height="36" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#713f12">Leber: 2 Lactat → 1 Glucose (−6 ATP)</text>
  <text x="200" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#713f12">Netto-Bilanz Zyklus: −4 ATP</text>

  <!-- Note: regenerates NAD+ in muscle -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Muskel regeneriert NAD⁺ für weitere Glykolyse</text>
</svg>
