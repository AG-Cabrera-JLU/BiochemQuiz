<svg xmlns="http://www.w3.org/2000/svg" width="400" height="185" viewBox="0 0 400 185">
  <rect width="400" height="185" fill="none"/>
  <!-- Title -->
  <text x="200" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Glykolyse Phase 1 – Energie-Investition</text>

  <!-- Glucose -->
  <rect x="148" y="24" width="104" height="28" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Glucose</text>

  <!-- Arrow 1: Hexokinase -->
  <line x1="200" y1="52" x2="200" y2="64" stroke="#475569" stroke-width="1.5"/>
  <polygon points="195,61 200,70 205,61" fill="#475569"/>
  <!-- Enzyme label left -->
  <text x="130" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#475569">Hexokinase</text>
  <!-- ATP cost label right -->
  <rect x="210" y="54" width="50" height="14" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="235" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7f1d1d">−1 ATP</text>

  <!-- Glc-6-P -->
  <rect x="130" y="70" width="140" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#312e81">Glukose-6-Phosphat</text>

  <!-- Arrow 2: Isomerase -->
  <line x1="200" y1="98" x2="200" y2="110" stroke="#475569" stroke-width="1.5"/>
  <polygon points="195,107 200,116 205,107" fill="#475569"/>
  <text x="127" y="109" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#475569">Isomerase</text>

  <!-- Fru-6-P -->
  <rect x="130" y="116" width="140" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="200" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#312e81">Fruktose-6-Phosphat</text>

  <!-- Arrow 3: PFK-1 -->
  <line x1="200" y1="144" x2="200" y2="156" stroke="#475569" stroke-width="1.5"/>
  <polygon points="195,153 200,162 205,153" fill="#475569"/>
  <text x="127" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#475569">PFK-1</text>
  <rect x="210" y="146" width="50" height="14" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="235" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7f1d1d">−1 ATP</text>

  <!-- Fru-1,6-bisP -->
  <rect x="112" y="162" width="176" height="18" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#78350f">Fruktose-1,6-bisPhosphat</text>

  <!-- Badge -->
  <rect x="326" y="100" width="68" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f1d1d">Gesamt:</text>
  <text x="360" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">−2 ATP</text>
</svg>
