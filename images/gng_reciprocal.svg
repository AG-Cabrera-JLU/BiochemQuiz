<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210">
  <rect width="400" height="210" fill="none"/>
  <!-- Title -->
  <text x="200" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Reziproke Regulation: PFK-1 vs. FBPase-1</text>

  <!-- PFK-1 column header -->
  <rect x="12" y="24" width="168" height="26" rx="5" fill="#2563eb" stroke="#1d4ed8" stroke-width="0"/>
  <text x="96" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">PFK-1  (Glykolyse)</text>

  <!-- FBPase-1 column header -->
  <rect x="220" y="24" width="168" height="26" rx="5" fill="#059669" stroke="#047857" stroke-width="0"/>
  <text x="304" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">FBPase-1  (GNG)</text>

  <!-- vs label -->
  <text x="200" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">vs.</text>

  <!-- Row 1: Citrat -->
  <rect x="8" y="58" width="176" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="96" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">Citrat</text>
  <text x="96" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⊖  Inhibierung</text>

  <rect x="216" y="58" width="176" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="304" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">Citrat</text>
  <text x="304" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">⊕  Aktivierung</text>

  <!-- Row 2: AMP -->
  <rect x="8" y="98" width="176" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="96" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">AMP</text>
  <text x="96" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">⊕  Aktivierung</text>

  <rect x="216" y="98" width="176" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">AMP</text>
  <text x="304" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⊖  Inhibierung</text>

  <!-- Row 3: Fru-2,6-bisP -->
  <rect x="8" y="138" width="176" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="96" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">Fru-2,6-bisPhosphat</text>
  <text x="96" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">⊕  Aktivierung</text>

  <rect x="216" y="138" width="176" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">Fru-2,6-bisPhosphat</text>
  <text x="304" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⊖  Inhibierung</text>

  <!-- Bottom note -->
  <rect x="60" y="178" width="280" height="26" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#713f12">Fru-2,6-bisP (↑ Insulin, ↓ Glucagon): stärkster Aktivator von PFK-1</text>
  <text x="200" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#713f12">→ koordiniert Glykolyse/GNG in Abhängigkeit vom Hormonstatus</text>
</svg>
